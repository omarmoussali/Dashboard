<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Inicio · Hoy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,500;1,9..144,600&display=swap" rel="stylesheet">
<script src="lock.js" defer></script>
<script src="topbar.js" defer></script>
<style>
:root {
  --text-primary:#FAFAFA; --text-secondary:#B8B6B0; --text-tertiary:#76746E;
  --emerald:#6BE3A4; --emerald-2:#34d399; --emerald-deep:#1f8a5a;
  --warning:#F2C063; --danger:#FF6B6B;
  --font:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#050506;color:var(--text-secondary);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden;padding:4px max(20px,env(safe-area-inset-right)) max(64px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 78% 8%,rgba(52,211,153,.16),transparent 46%),radial-gradient(circle at 12% 88%,rgba(34,197,134,.10),transparent 52%);filter:blur(46px);pointer-events:none;z-index:-2}
.page{max-width:640px;margin:0 auto}
.hd{padding:26px 0 6px}
.hd h1{margin:0;font-family:var(--serif);font-style:italic;font-weight:500;font-size:40px;color:#EDEAE2;line-height:1.05}
.hd h1 em{color:var(--emerald)}
.hd .date{margin-top:6px;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--text-tertiary)}
.eyebrow{font-family:var(--font-mono);font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--text-tertiary);display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.eyebrow::before{content:'';width:16px;height:1px;background:var(--text-tertiary);opacity:.6}
.eyebrow::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.08),transparent)}
.card{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:18px}
/* runway */
.run{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.run .big{font-family:var(--serif);font-style:italic;font-size:44px;color:var(--text-primary);line-height:1}
.run .lvl{font-family:var(--font-mono);font-size:10px;font-weight:800;letter-spacing:.18em;padding:5px 10px;border-radius:999px;background:rgba(242,192,99,.12);color:var(--warning);border:1px solid rgba(242,192,99,.35)}
.run .sub{width:100%;font-size:13px;color:var(--text-tertiary);margin-top:4px}
.run .sub b{color:var(--text-secondary);font-variant-numeric:tabular-nums}
/* top3 */
.t3{display:flex;flex-direction:column;gap:10px}
.t3 label{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:13px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);cursor:pointer;transition:border-color .15s}
.t3 label:hover{border-color:rgba(107,227,164,.3)}
.t3 input{appearance:none;width:20px;height:20px;flex:0 0 auto;margin-top:1px;border-radius:7px;border:1.5px solid rgba(255,255,255,.25);background:transparent;cursor:pointer;position:relative}
.t3 input:checked{background:var(--emerald);border-color:var(--emerald)}
.t3 input:checked::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;color:#04130b;font-size:13px;font-weight:900}
.t3 .tx{font-size:14.5px;color:var(--text-primary);line-height:1.45}
.t3 .tx small{display:block;color:var(--text-tertiary);font-size:12px;margin-top:2px}
.t3 input:checked ~ .tx{opacity:.45;text-decoration:line-through}
/* quotas */
.q{display:flex;flex-direction:column;gap:14px}
.q .row{display:flex;flex-direction:column;gap:6px}
.q .k{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary)}
.q .k b{color:var(--text-primary);font-variant-numeric:tabular-nums}
.q .bar{height:7px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden}
.q .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--emerald-deep),var(--emerald));box-shadow:0 0 12px rgba(107,227,164,.35);transition:width .4s}
/* sections nav */
.sec-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.sec-grid{grid-template-columns:1fr}}
.sec-card{display:flex;align-items:center;gap:13px;padding:15px 16px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);text-decoration:none;transition:border-color .15s,transform .15s,background .15s}
.sec-card:hover{border-color:rgba(107,227,164,.35);background:rgba(107,227,164,.04);transform:translateY(-1px)}
.sec-card .ic{font-size:22px;flex:0 0 auto;filter:drop-shadow(0 4px 12px rgba(52,211,153,.25))}
.sec-card .nm{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--text-primary);line-height:1.1}
.sec-card .ds{font-size:11.5px;color:var(--text-tertiary);margin-top:3px;line-height:1.35}
/* mode switch: L–V trabajo vs S–D finde */
.modebar{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:16px;padding:5px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
.modebar button{padding:10px 8px;border:0;border-radius:10px;background:transparent;color:var(--text-tertiary);font-family:var(--font-mono);font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:background .15s,color .15s}
.modebar button.on{background:rgba(107,227,164,.14);color:var(--emerald)}
.modebar button .sub{display:block;margin-top:3px;font-size:9px;letter-spacing:.06em;opacity:.7;font-weight:600}
.today-pill{display:inline-block;margin-left:8px;padding:2px 7px;border-radius:999px;font-family:var(--font-mono);font-size:8.5px;font-weight:800;letter-spacing:.08em;background:rgba(107,227,164,.16);color:var(--emerald);vertical-align:middle}
.wk-intro{font-size:12.5px;color:var(--text-tertiary);line-height:1.6;margin:0 0 12px}
/* Mensaje del día — lo primero y lo más importante que se ve. Aire, poca letra. */
.msg{margin:22px 0 4px;padding:30px 26px;border-radius:20px;background:rgba(255,255,255,.028);border:1px solid rgba(255,255,255,.05);position:relative}
.msg p{margin:0;font-family:var(--serif);font-style:italic;font-weight:400;font-size:20px;line-height:1.55;color:#EDEAE2;letter-spacing:-.01em}
.msg .msg-k{display:block;font-family:var(--font-mono);font-size:9px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:14px;opacity:.8}
.msg-more{position:absolute;right:14px;bottom:12px;background:none;border:0;color:var(--text-tertiary);font-size:15px;line-height:1;padding:6px;cursor:pointer;opacity:.35;transition:opacity .15s}
.msg-more:hover{opacity:.9}
/* Navegación compacta: iconos en una fila, sin párrafos que leer */
.navrow{display:flex;gap:8px;margin-top:22px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.navrow::-webkit-scrollbar{display:none}
.navrow a{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;width:66px;padding:13px 6px;border-radius:15px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.055);text-decoration:none;transition:border-color .15s,background .15s}
.navrow a:hover{border-color:rgba(107,227,164,.3);background:rgba(107,227,164,.04)}
.navrow .ic{font-size:20px;line-height:1}
.navrow .nm{font-size:10.5px;color:var(--text-secondary);text-align:center;line-height:1.15}
/* Lo secundario, plegado: números, cuotas y notas no gritan al entrar */
details.more{margin-top:24px;border-top:1px solid rgba(255,255,255,.055);padding-top:6px}
details.more>summary{list-style:none;cursor:pointer;padding:12px 2px;font-family:var(--font-mono);font-size:9.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--text-tertiary);display:flex;align-items:center;gap:8px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:'+';margin-left:auto;font-size:14px;opacity:.7}
details.more[open]>summary::after{content:'–'}
.note{margin:16px 0 4px;font-size:12.5px;color:var(--text-tertiary);line-height:1.6;border-left:2px solid rgba(107,227,164,.35);padding-left:12px}
.note b{color:var(--emerald)}
.foot{margin-top:26px;padding-top:14px;border-top:1px solid rgba(255,255,255,.05);font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-tertiary);display:flex;justify-content:space-between}
.foot a{color:var(--text-tertiary)}
</style>
</head>
<body>
<div class="page">
  <header class="hd">
    <h1>Tu <em>hoy</em>.</h1>
    <div class="date" id="date"></div>
  </header>

  <div class="msg">
    <span class="msg-k">Hoy</span>
    <p id="msgText"></p>
    <button class="msg-more" id="msgMore" type="button" title="Otro" aria-label="Otro mensaje">↻</button>
  </div>

  <div class="modebar" id="modebar">
    <button data-mode="work" id="mbWork">L–V · Trabajo<span class="sub">12 h · foco liquidez</span></button>
    <button data-mode="weekend" id="mbWeekend">S–D · Finde<span class="sub">imagen · marca · descanso</span></button>
  </div>

  <div id="viewWork">
    <div class="t3" id="top3"></div>
  </div>

  <div id="viewWeekend" hidden>
    <div class="t3" id="weekend"></div>
  </div>

  <nav class="navrow">
    <a href="gym.html"><span class="ic">🏋️</span><span class="nm">Gym</span></a>
    <a href="health.html"><span class="ic">🫀</span><span class="nm">Salud</span></a>
    <a href="finance.html"><span class="ic">🌱</span><span class="nm">Dinero</span></a>
    <a href="po-water.html"><span class="ic">💧</span><span class="nm">Agua</span></a>
    <a href="caffeine.html"><span class="ic">☕</span><span class="nm">Café</span></a>
    <a href="main.html"><span class="ic">⛰️</span><span class="nm">Peak</span></a>
  </nav>

  <details class="more">
    <summary>Números</summary>
    <div class="card run">
      <span class="big" id="run-months"></span>
      <span class="lvl" id="run-level"></span>
      <span class="sub"><b id="run-cash"></b> en caja · quema <b id="run-burn"></b>/mes · actualizado <span id="run-upd"></span></span>
    </div>
    <div class="card q" id="quotas" style="margin-top:10px"></div>
    <p class="note" id="note"></p>
  </details>

  <div class="foot"><span>AIOS · inicio v2</span><span>datos: auto-feed AIOS · en vivo · <a href="hub.html">hub clásico</a></span></div>
</div>

<script>
/* ====== DATOS ======
   Auto-feed EN VIVO desde el AIOS (Supabase · key 'aios_today'). El AIOS empuja
   las misiones del día con system/scripts/push-today.mjs y esta home las lee al
   abrir / volver a la pestaña. FALLBACK = último estado conocido, por si no hay
   red o todavía no se ha empujado nada (la home nunca se queda en blanco). */
const FALLBACK = {
  runway: { cash: 738.54, burn: 130, months: 5.7, level: 'TIGHT', updated: '10 jun · saldo real: lun' },
  top3: [
    { t: 'Saldo del banco → quema real', s: '30 s: un número y la runway deja de ser papel' },
    { t: '5 candidaturas — DEUDA DE HONOR', s: 'vencen HOY. El CV (SDR) ya está listo: Harbiz, MIRCoach, 2× InfoJobs' },
    { t: '/weekly — reset honesto de la semana', s: 'cerrar la W24 del finde y fijar cuotas de la W25' }
  ],
  quotas: [
    { k: 'Candidaturas (deuda)', cur: 0, target: 5 },
    { k: 'Entrenos', cur: 0, target: 4 },
    { k: 'Deep work (h)', cur: 0, target: 12 }
  ],
  note: 'Mostrando el último estado conocido — esperando el próximo auto-feed del AIOS.',
  weekend: [
    { t: 'Fotos', s: 'Outfit listo · un sitio · luz de tarde' },
    { t: 'Dejar la semana montada', s: 'Batidos y comida preparados' },
    { t: 'Descansar de verdad', s: 'Un día sin alarma' }
  ]
};
/* ====== MENSAJE DEL DÍA ======
   Uno por día, el mismo toda la jornada (cambia solo al cambiar la fecha).
   Vive aquí dentro a propósito: funciona sin red y sin depender de nadie.
   Sirven para lo mismo — cortar la rumiación y empujar a hacer lo de hoy.
   Si el AIOS manda un `mensaje` en el feed, ese manda por encima. */
const MENSAJES = [
  'La cabeza da más vueltas cuando el cuerpo está quieto. Muévete primero; el ruido baja solo.',
  'No tienes que entenderlo todo hoy. Solo tienes que hacer lo de hoy.',
  'Pensarlo otra vez no te va a dar una respuesta nueva. Ya la tienes.',
  'Si llevas veinte minutos dándole vueltas, ya no estás pensando. Levántate.',
  'Hoy no busques tener ganas. Busca empezar. Las ganas vienen después, nunca antes.',
  'Aparecer los días malos es lo que separa a quien cambia de quien solo lo intenta.',
  'No tiene que ser tu mejor día. Tiene que ser un día hecho.',
  'El listón de hoy es bajo: haz una sola cosa bien. Con eso vale.',
  'Esto no se arregla en una semana. Se arregla en doce. Vas por la primera.',
  'Dentro de un año esto será una historia que cuentas, no una que te pesa.',
  'Nadie ve los meses aburridos. Todo el mundo ve el resultado.',
  'Lo que construyas estos meses no te lo puede quitar nadie.',
  'Tu valor no lo decide quien se fue. Lo decides tú, y se demuestra con lo que haces.',
  'Que alguien no supiera cuidarte no dice nada de ti.',
  'Lo que te aceptes a ti marca lo que vas a aceptar de los demás.',
  'El dolor no se piensa, se atraviesa. Hoy toca atravesar un día más.',
  'Estás cansado, no roto. No es lo mismo.',
  'Los días malos también cuentan como días trabajados.',
  'Doce horas al volante no son tiempo perdido: son el suelo que te deja levantar todo lo demás.',
  'Cada día trabajado es un día menos dependiendo de nadie.',
  'El dinero no te va a quitar la pena, pero sí el miedo. Y con menos miedo se piensa mejor.',
  'El gimnasio es lo único de hoy que puedes controlar entero. Aprovéchalo.',
  'Duerme. Es la mitad del tratamiento y es gratis.',
  'Come aunque no tengas hambre. Tu cabeza también funciona con calorías.',
  'Hoy no hace falta estar bien. Hace falta estar en marcha.',
  'El pasado ya no admite cambios. El mes que viene sí.',
  'Empezar otra vez con lo que ahora sabes no es retroceder.',
  'Lo que sientes hoy no es lo que vas a sentir siempre.',
  'No te compares con quien eras hace un mes. Compárate con quien serías si te rindes.',
  'Tienes gente que te quiere bien. Escríbele a uno hoy.',
  'Haz la cama, dúchate, sal a la calle. En ese orden. Suena tonto y funciona.',
  'No estás atrasado en la vida. Estás en tu tramo difícil, que no es lo mismo.',
  'Cuando no sepas qué hacer, haz lo siguiente pequeño. Solo eso.',
  'Un año de esto y no te reconoce nadie, empezando por ti.',
  'Tu trabajo de hoy no tiene que impresionar a nadie. Solo tiene que estar hecho.',
  'Descansar no es rendirse. Es parte del plan.'
];
const SUPA_URL = 'https://dhukvmiffrqnkzvmvofb.supabase.co';
const SUPA_KEY = 'sb_publishable_JTo9zCRGuSwgkMalLrJMHA_l-CDxTcE';
const FEED_KEY = 'aios_today';
/* ======================================================================================= */

const $ = id => document.getElementById(id);
const days = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const months = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

/* Fecha EN VIVO — la home ya no se queda congelada en una fecha fija. */
const now = new Date();
const pad = n => String(n).padStart(2, '0');
const iso = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
$('date').textContent = `${days[now.getDay()]} ${now.getDate()} de ${months[now.getMonth()]} · ${iso}`;

/* Los checks del Top 3 se guardan por día → se resetean solos cada jornada.
   El listener se ata UNA vez (delegación sobre #top3, que es estable aunque
   su contenido se vuelva a pintar al llegar el feed). */
const lsKey = 'today:' + iso;
$('top3').addEventListener('change', () => {
  const state = [...document.querySelectorAll('#top3 input')].map(c => c.checked);
  localStorage.setItem(lsKey, JSON.stringify(state));
});
/* La lista del finde se guarda por SEMANA (no por día): el sábado y el domingo
   comparten los mismos recados, así lo tachado el sábado sigue tachado el domingo. */
const weekKey = (() => {
  const d = new Date(now); d.setHours(0,0,0,0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); // lunes de esta semana
  return 'weekend:' + d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
})();
$('weekend').addEventListener('change', () => {
  const state = [...document.querySelectorAll('#weekend input')].map(c => c.checked);
  localStorage.setItem(weekKey, JSON.stringify(state));
});

/* Modo: sáb/dom → finde, resto → trabajo. Se puede cambiar a mano para
   preparar el finde un jueves; no se guarda, cada visita vuelve a lo que toca. */
const isWeekendToday = (now.getDay() === 0 || now.getDay() === 6);
let mode = isWeekendToday ? 'weekend' : 'work';
function applyMode() {
  $('viewWork').hidden = (mode !== 'work');
  $('viewWeekend').hidden = (mode !== 'weekend');
  $('mbWork').classList.toggle('on', mode === 'work');
  $('mbWeekend').classList.toggle('on', mode === 'weekend');
}
$('modebar').addEventListener('click', e => {
  const b = e.target.closest('button[data-mode]');
  if (!b) return;
  mode = b.dataset.mode;
  applyMode();
});

/* Índice estable por día: el mismo mensaje toda la jornada. */
const dayIdx = Math.floor(new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime() / 86400000);
let feedMsg = null, msgOffset = 0;
function renderMsg() {
  if (feedMsg && msgOffset === 0) { $('msgText').textContent = feedMsg; return; }
  const k = msgOffset - (feedMsg ? 1 : 0);
  const i = ((dayIdx + k) % MENSAJES.length + MENSAJES.length) % MENSAJES.length;
  $('msgText').textContent = MENSAJES[i];
}
$('msgMore').addEventListener('click', () => { msgOffset++; renderMsg(); });
renderMsg();

function render(d) {
  if (!d || !d.runway) return;
  if (d.mensaje && d.mensaje !== feedMsg) { feedMsg = d.mensaje; msgOffset = 0; renderMsg(); }
  $('run-months').textContent = String(d.runway.months).replace('.', ',') + ' meses';
  $('run-level').textContent = d.runway.level;
  $('run-cash').textContent = Number(d.runway.cash).toLocaleString('es-ES', {style:'currency', currency:'EUR'});
  $('run-burn').textContent = '~' + d.runway.burn + ' €';
  $('run-upd').textContent = d.runway.updated;

  const saved = JSON.parse(localStorage.getItem(lsKey) || '[]');
  $('top3').innerHTML = (d.top3 || []).map((x, i) => `
    <label><input type="checkbox" data-i="${i}" ${saved[i] ? 'checked' : ''}>
    <span class="tx">${x.t}<small>${x.s || ''}</small></span></label>`).join('');

  const wk = (d.weekend && d.weekend.length) ? d.weekend : FALLBACK.weekend;
  const savedWk = JSON.parse(localStorage.getItem(weekKey) || '[]');
  $('weekend').innerHTML = wk.map((x, i) => `
    <label><input type="checkbox" data-i="${i}" ${savedWk[i] ? 'checked' : ''}>
    <span class="tx">${x.t}<small>${x.s || ''}</small></span></label>`).join('');

  $('quotas').innerHTML = (d.quotas || []).map(q => `
    <div class="row"><div class="k"><span>${q.k}</span><b>${q.cur} / ${q.target}</b></div>
    <div class="bar"><div class="fill" style="width:${Math.min(100, q.cur/q.target*100)}%"></div></div></div>`).join('');

  $('note').innerHTML = d.note || '';
}
applyMode();

/* Pinta YA con el fallback (nunca en blanco), luego trae el feed en vivo. */
render(FALLBACK);
async function pull() {
  try {
    const r = await fetch(SUPA_URL + '/rest/v1/app_state?select=data&key=eq.' + FEED_KEY, {
      headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + SUPA_KEY }
    });
    if (!r.ok) return;
    const rows = await r.json();
    if (Array.isArray(rows) && rows[0] && rows[0].data && Object.keys(rows[0].data).length) {
      render(rows[0].data);
    }
  } catch (e) {}
}
pull();
/* Al volver a la pestaña (por la mañana, al abrir el móvil) → se refresca solo. */
document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(); });
</script>
</body>
</html>
